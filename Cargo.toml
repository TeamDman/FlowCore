[workspace]
members = ["crates/*"]

[workspace.package]
authors = ["TeamDman"]
repository = "https://github.com/TeamDman/FlowCore.git"
edition = "2024"

[workspace.dependencies]
flow_core_config = { path = "crates/config" }
clap = { version = "4.5.37", features = ["derive"] }
color-eyre = "0.6.3"
eyre = "0.6.12"
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
ollama-rs = { version = "0.3.1", features = [
    "stream",
    "modelfile",
], path = "D:/Repos/ollama-rs/ollama-rs" }
tokio = { version = "1.36.0", features = ["full"] }
tokio-stream = "0.1.14"
base64 = "0.22.1"
serde = { version = "1.0.219", features = ["derive", "rc"] }
serde_json = "1.0.140"
async-trait = "0.1.88"
directories-next = "2.0.0"
chrono = "0.4.41"
cloud_terrastodon_user_input = "0.1.3"

[package]
name = "FlowCore"
version = "0.1.0"
authors.workspace = true
repository.workspace = true
edition.workspace = true

[dependencies]
clap.workspace = true
color-eyre.workspace = true
eyre.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
